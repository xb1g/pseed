           C1335 827 1373 807 1380 772
           C1388 737 1356 705 1317 710
           C1288 713 1265 720 1242 724 Z"/>
      <path fill="#246fe0" opacity="0.9"
        d="M1324 533
           C1358 560 1373 595 1360 628
           C1331 612 1301 596 1283 577
           C1264 556 1295 516 1324 533 Z"/>
