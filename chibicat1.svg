      <path class="ink thick" fill="#444b54"
        d="M1242 724
           C1327 687 1369 619 1341 558
           C1322 515 1275 511 1250 543
           C1218 584 1249 626 1304 645
           C1405 680 1483 777 1451 854
           C1424 921 1344 927 1308 877
