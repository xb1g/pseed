        <ellipse cx="913" cy="660" rx="55" ry="32" fill="#5fa9ff" opacity="0.55"/>
        <ellipse class="glint" cx="896" cy="572" rx="13" ry="35" fill="#9ccfff" opacity="0.75"
          transform="rotate(14 896 572)"/>
        <circle class="glint" cx="916" cy="649" r="13" fill="#8cc6ff" opacity="0.55"/>
