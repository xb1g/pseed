<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Animated chibi blue cat character</title>
  <desc id="desc">A chibi cat-eared character with blue eyes, gray and blue hair, a peace sign, laptop, tie, and swishing tail.</desc>

  <defs>
    <linearGradient id="hairGrad" x1="760" y1="240" x2="1240" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56606b"/>
      <stop offset="0.45" stop-color="#3f4751"/>
      <stop offset="1" stop-color="#252c34"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="770" y1="250" x2="1320" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c82ff"/>
      <stop offset="0.5" stop-color="#1668d5"/>
      <stop offset="1" stop-color="#0647a9"/>
    </linearGradient>

    <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#003d9f"/>
      <stop offset="0.52" stop-color="#1165d4"/>
      <stop offset="1" stop-color="#77b8ff"/>
    </linearGradient>

    <radialGradient id="skinGrad" cx="50%" cy="38%" r="76%">
      <stop offset="0" stop-color="#fffdfb"/>
      <stop offset="0.78" stop-color="#fff5f2"/>
      <stop offset="1" stop-color="#ffd6dc"/>
    </radialGradient>

    <radialGradient id="blushGrad">
      <stop offset="0" stop-color="#ff9db8" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#ffb9c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb9c8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shirtGrad" x1="930" y1="650" x2="1240" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#c6cdea"/>
    </linearGradient>

    <linearGradient id="metalGrad" x1="670" y1="700" x2="940" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#555e66"/>
      <stop offset="1" stop-color="#2f363d"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    .ink {
      stroke: #070704;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .thick { stroke-width: 12; }
    .med { stroke-width: 7; }
    .thin { stroke-width: 4.5; }
    .nofill { fill: none; }

    .eye {
      transform-box: fill-box;
      transform-origin: 50% 55%;
      animation: blink 5s infinite;
    }

    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      93%, 95% { transform: scaleY(0.08); }
    }

    .glint {
      transform-box: fill-box;
      transform-origin: center;
      animation: glint 2.6s ease-in-out infinite;
    }

    @keyframes glint {
      0%, 100% { opacity: .78; transform: translate(0,0) scale(1); }
      50% { opacity: .35; transform: translate(-3px,-4px) scale(1.12); }
    }

    .blush {
      animation: blushPulse 3.2s ease-in-out infinite;
    }

    @keyframes blushPulse {
      0%, 100% { opacity: .55; }
      50% { opacity: .82; }
    }
  </style>

  <!-- Background: remove this rect for transparency -->
  <rect width="1600" height="900" fill="#000"/>

  <g id="character">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 4; 0 -7; 0 4"
      dur="3.1s"
      repeatCount="indefinite"/>

