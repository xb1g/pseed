      <path class="ink thin nofill" d="M1229 667 C1240 661 1249 664 1253 672"/>
      <circle cx="847" cy="690" r="7" fill="#fff" opacity="0.95"/>
      <circle cx="1227" cy="692" r="7" fill="#fff" opacity="0.95"/>
    </g>

    <!-- Front bangs, including blue central lock -->
