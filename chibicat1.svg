      <path class="ink med nofill"
        d="M1017 746 C1033 763 1054 764 1070 746"/>
      <path class="ink med nofill"
        d="M977 796 L930 870"/>
      <path class="ink med nofill"
        d="M1106 798 L1158 870"/>
