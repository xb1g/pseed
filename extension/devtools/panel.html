<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DM Copilot — DevTools</title>
    <style>
      :root {
        --bg: #14102b;
        --card: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f4ecff;
        --muted: rgba(244, 236, 255, 0.6);
        --accent: #fb923c;
        --ok: #34d399;
        --warn: #fbbf24;
        --bad: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
        font-size: 12px;
      }
      h2 { font-size: 13px; margin: 0 0 8px; }
      .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
      button {
        padding: 5px 9px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.primary { border-color: var(--accent); background: rgba(251, 146, 60, 0.18); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
      .cell {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 9px;
      }
      .cell .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
      .cell .v { margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
      table { width: 100%; border-collapse: collapse; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 500; font-size: 10px; text-transform: uppercase; }
      td.detail { color: var(--muted); white-space: pre-wrap; word-break: break-all; }
      .lvl-info { color: var(--ok); }
      .lvl-warn { color: var(--warn); }
      .lvl-error { color: var(--bad); }
      .empty { color: var(--muted); padding: 14px 4px; }
    </style>
  </head>
  <body>
    <h2>DM Copilot</h2>
    <div class="bar">
      <button id="inject" class="primary">Inject scripts</button>
      <button id="rescan">Rescan thread</button>
      <button id="history">Load full history</button>
      <button id="ping">Test token</button>
      <button id="clear">Clear log</button>
      <label style="display: flex; align-items: center; gap: 4px; color: var(--muted)">
        <input type="checkbox" id="auto" checked /> auto-refresh
      </label>
    </div>
    <div class="grid" id="status"></div>
    <table>
      <thead>
        <tr><th style="width: 78px">time</th><th style="width: 190px">event</th><th>detail</th></tr>
      </thead>
      <tbody id="log"></tbody>
    </table>
    <div class="empty" id="empty">ยังไม่มี event — เปิดแชท IG แล้วกด Rescan</div>
    <script src="panel.js"></script>
  </body>
</html>
