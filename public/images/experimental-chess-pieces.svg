<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Four chess piece silhouettes</title>
  <desc id="desc">A row of four stylized chess pieces: rook, queen, bishop, and knight.</desc>
  <defs>
    <linearGradient id="pieceFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f5f0"/>
      <stop offset="1" stop-color="#a7a7a0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .piece { fill: url(#pieceFill); stroke: rgba(255,255,255,.42); stroke-width: 2; filter: url(#softShadow); }
      .cut { fill: #1b1b1b; opacity: .9; }
    </style>
  </defs>

  <!-- Rook -->
  <g transform="translate(50 20)">
    <path class="piece" d="M42 180h116l13 28H29l13-28Zm11-22h94v25H53v-25Zm15-78h64l10 82H58l10-82Zm-8-51h20v26h22V29h24v26h22V29h20v54H60V29Z"/>
    <path class="cut" d="M74 88h52l5 49H69l5-49Z"/>
  </g>

  <!-- Queen -->
  <g transform="translate(290 20)">
    <path class="piece" d="M36 180h128l13 28H23l13-28Zm12-24h104v27H48v-27Zm5-79 27 50h40l27-50 15 85H38l15-85Zm-10-30a15 15 0 1 1 0-1Zm44-18a15 15 0 1 1 0-1Zm44 18a15 15 0 1 1 0-1Zm-22 1-19 68h39l-20-68Z"/>
    <path class="cut" d="M71 151h58v11H71z"/>
  </g>

  <!-- Bishop -->
  <g transform="translate(530 20)">
    <path class="piece" d="M43 180h114l13 28H30l13-28Zm10-24h94v27H53v-27Zm16-63c0-31 22-49 41-68 20 19 42 37 42 68 0 30-17 51-42 64-24-13-41-34-41-64Zm41-79a14 14 0 1 1 0-.5Z"/>
    <path class="cut" d="M119 56c7 18 1 39-18 62l-10-8c18-20 23-35 17-50l11-4Z"/>
  </g>

  <!-- Knight -->
  <g transform="translate(770 20)">
    <path class="piece" d="M38 180h126l13 28H25l13-28Zm14-24h101v27H52v-27Zm22-4c-10-31-1-61 24-88l-23-21c39-21 76-18 103 18 12 16 17 35 14 58l-17 37H74Zm42-86c-10 7-18 17-25 31 20-7 38-3 53 12l8-17c-7-14-19-23-36-26Z"/>
    <circle class="cut" cx="136" cy="78" r="5"/>
  </g>
</svg>
